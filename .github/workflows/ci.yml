name: CI

on:
  pull_request:
    branches: [develop, preprod, main]
  push:
    branches: [develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app/ tests/ --output-format=github

      - name: Mypy strict
        run: mypy app/ --strict

      - name: Pip audit
        run: |
          pip-audit \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln GHSA-5239-wwwm-4pmq

      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-fail-under=80
        env:
          YUNI_ENV: dev
          REDIS_URL: redis://localhost:6379/0
          MISTRAL_API_KEY: test-key-not-real
          JWT_PUBLIC_KEY: ""
          ANONYMIZATION_SALT: test-salt
          YUNICITY_API_BASE_URL: http://mock-not-called
          YUNICITY_SERVICE_TOKEN: mock-token
          STRIPE_SECRET_KEY: sk_test_mock
          STRIPE_WEBHOOK_SECRET: whsec_mock
          STRIPE_PUBLISHABLE_KEY: pk_test_mock
          ALLOWED_HOSTS: "*"

      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pip audit JSON
        run: |
          pip-audit --format=json --output=audit-results.json \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln GHSA-5239-wwwm-4pmq

      - name: Check audit results
        run: python scripts/check_audit.py audit-results.json

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: audit-results.json
          retention-days: 7
