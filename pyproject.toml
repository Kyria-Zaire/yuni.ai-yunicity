[project]
name = "yuni-ai"
version = "2.0.0"
description = "Microservice IA hyperlocal pour Yunicity — recommandations personnalisées"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "redis[hiredis]>=5",
    "httpx>=0.27",
    "mistralai>=1.0",
    "tenacity>=8",
    "structlog>=24",
    "PyJWT[crypto]>=2.8",
    "qdrant-client>=1.9",
    "stripe>=8",
    "openai>=1.30",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
firebase = [
    "firebase-admin>=6.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "factory-boy>=3.3",
    "faker>=25",
    "fakeredis[aioredis]>=2.23",
    "types-redis>=4",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = [
    "S101",   # Allow assert in tests
    "UP046",  # Generic[T] is standard for Pydantic models
    "B008",   # Depends() in default args is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S107"]
"app/models/city.py" = ["S105"]
"app/services/city_registry_service.py" = ["S106"]
"scripts/**/*.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "mistralai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qdrant_client.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "stripe.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
