name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  pre-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Quality gate
        run: |
          python -m mypy app/ --strict
          python -m ruff check app/ tests/
          python -m pytest tests/ -q --tb=short
      - name: Pre-deploy check
        run: python scripts/pre_deploy_check.py

  deploy:
    needs: pre-checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway production
        run: railway up --service yuni-ai-prod --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}
      - name: Wait for deployment
        run: sleep 90
      - name: Production smoke tests
        run: |
          response=$(curl -sf \
            https://yuni-ai.up.railway.app/health \
            --max-time 10)
          echo "$response" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['status'] == 'healthy', f'Status: {d[\"status\"]}'
          assert d['services']['redis'] == 'connected', 'Redis not connected'
          print('Health check passed')
          "
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://yuni-ai.up.railway.app/v1/recommend/engagement \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$status" = "401" ] || [ "$status" = "422" ]; then
            echo "Endpoint secured (returns $status)"
          else
            echo "Unexpected status: $status"
            exit 1
          fi

  post-deploy-monitoring:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Monitor 5 minutes post-deploy
        run: |
          for i in $(seq 1 5); do
            sleep 60
            status=$(curl -s https://yuni-ai.up.railway.app/health | \
              python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
            echo "Minute $i: $status"
            [ "$status" = "healthy" ] || exit 1
          done
          echo "5 min post-deploy monitoring passed"
