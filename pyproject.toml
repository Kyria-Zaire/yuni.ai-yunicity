[project]
name = "yuni-ai"
version = "0.1.0"
description = "Microservice IA hyperlocal pour Yunicity — recommandations personnalisées"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "redis[hiredis]>=5",
    "httpx>=0.27",
    "mistralai>=1.0",
    "tenacity>=8",
    "structlog>=24",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "factory-boy>=3.3",
    "faker>=25",
    "fakeredis[aioredis]>=2.23",
    "types-redis>=4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = [
    "S101",   # Allow assert in tests
    "UP046",  # Generic[T] is standard for Pydantic models
    "B008",   # Depends() in default args is standard FastAPI pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
